{% extends "base.html" %}
{% block title %}Seuils — {{ agent.agent_name }}{% endblock %}

{% block content %}
<p><a class="retour" href="{{ url_for('historique', agent_id=agent.id) }}">← {{ agent.agent_name }}</a></p>

<section class="carte formulaire-seuils">
  <h1>Seuils d'alerte</h1>
  <p class="discret">{{ agent.agent_name }}{% if agent.hostname %} · {{ agent.hostname }}{% endif %}</p>

  <form method="post">
    <label for="cpu_crit">CPU critique (%)</label>
    <input type="number" id="cpu_crit" name="cpu_crit" min="0" max="100" step="0.1"
           value="{{ valeurs.cpu_crit }}" required>

    <label for="ram_crit">RAM critique (%)</label>
    <input type="number" id="ram_crit" name="ram_crit" min="0" max="100" step="0.1"
           value="{{ valeurs.ram_crit }}" required>

    <label for="disk_crit">Disque critique (%)</label>
    <input type="number" id="disk_crit" name="disk_crit" min="0" max="100" step="0.1"
           value="{{ valeurs.disk_crit }}" required>

    <label for="offline_after_s">Hors ligne après (secondes)</label>
    <input type="number" id="offline_after_s" name="offline_after_s" min="10" max="86400" step="1"
           value="{{ valeurs.offline_after_s }}" required>

    <button type="submit">Enregistrer</button>
  </form>
</section>
{% endblock %}
